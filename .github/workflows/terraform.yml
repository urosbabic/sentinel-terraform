name: Sentinel Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "detections/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "detections/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: terraform
        run: terraform validate -no-color

  deploy:
    name: Plan and apply to Sentinel
    if: >-
      vars.ENABLE_SENTINEL_DEPLOYMENT == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_resource_group_name: ${{ vars.SENTINEL_RESOURCE_GROUP }}
      TF_VAR_workspace_name: ${{ vars.SENTINEL_WORKSPACE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Initialize remote state
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=sentinel-terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Create Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=sentinel.tfplan

      - name: Apply Terraform plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve sentinel.tfplan
