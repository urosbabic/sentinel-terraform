name: Sentinel Terraform

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "bootstrap/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "bootstrap/**"
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Create a plan without applying it"
        required: true
        default: true
        type: boolean
      terraform_targets:
        description: "Optional JSON array of Terraform resource addresses for a targeted plan"
        required: false
        default: "[]"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Check formatting
        run: terraform fmt -check -recursive .

      - name: Initialize without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: terraform
        run: terraform validate -no-color

      - name: Initialize bootstrap without backend
        working-directory: bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap configuration
        working-directory: bootstrap
        run: terraform validate -no-color

  deploy:
    name: Plan and optionally apply Sentinel content
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) ||
        (vars.ENABLE_SENTINEL_DEPLOYMENT == 'true' &&
        (github.event_name == 'workflow_dispatch' || github.event_name == 'push'))
      )
    needs: validate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_resource_group_name: ${{ vars.SENTINEL_RESOURCE_GROUP }}
      TF_VAR_workspace_name: ${{ vars.SENTINEL_WORKSPACE_NAME }}
      TF_VAR_enabled_playbooks: ${{ vars.ENABLED_PLAYBOOKS || '[]' }}
      TF_VAR_playbook_parameters: ${{ secrets.PLAYBOOK_PARAMETERS_JSON || '{}' }}
      TF_VAR_playbook_connections: ${{ secrets.PLAYBOOK_CONNECTIONS_JSON || '{}' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Initialize remote state
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=sentinel-terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Create Terraform plan
        working-directory: terraform
        env:
          TERRAFORM_TARGETS: ${{ inputs.terraform_targets || '[]' }}
        run: |
          if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$TERRAFORM_TARGETS" >/dev/null; then
            echo "terraform_targets must be a JSON array of Terraform resource addresses."
            exit 1
          fi

          mapfile -t targets < <(jq -r '.[]' <<< "$TERRAFORM_TARGETS")
          target_args=()
          for target in "${targets[@]}"; do
            target_args+=("-target=$target")
          done

          terraform plan -input=false -no-color -out=sentinel.tfplan "${target_args[@]}"

      - name: Apply Terraform plan
        if: >-
          vars.ENABLE_SENTINEL_DEPLOYMENT == 'true' &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
          )
        working-directory: terraform
        run: terraform apply -input=false -auto-approve sentinel.tfplan
